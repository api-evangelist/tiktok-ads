"""
TikTok Marketing API - GraphQL Schema
Derived from the TikTok Marketing REST API (business-api.tiktok.com/open_api)
Covers campaign management, ad groups, creatives, audiences, pixels, reporting, and attribution.
"""

# ─────────────────────────────────────────────
# Scalars
# ─────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar Long

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum CampaignStatus {
  CAMPAIGN_STATUS_ENABLE
  CAMPAIGN_STATUS_DISABLE
  CAMPAIGN_STATUS_DELETE
  CAMPAIGN_STATUS_ALL
}

enum CampaignObjective {
  REACH
  TRAFFIC
  APP_INSTALL
  VIDEO_VIEWS
  LEAD_GENERATION
  CONVERSIONS
  CATALOG_SALES
  COMMUNITY_INTERACTION
  PRODUCT_SALES
}

enum BudgetMode {
  BUDGET_MODE_TOTAL
  BUDGET_MODE_DAY
  BUDGET_MODE_INFINITE
}

enum AdGroupStatus {
  ADGROUP_STATUS_ENABLE
  ADGROUP_STATUS_DISABLE
  ADGROUP_STATUS_DELETE
  ADGROUP_STATUS_ALL
}

enum AdStatus {
  AD_STATUS_ENABLE
  AD_STATUS_DISABLE
  AD_STATUS_DELETE
  AD_STATUS_ALL
}

enum BillingEvent {
  CPC
  CPM
  CPV
  OCPM
  OCPC
}

enum OptimizationGoal {
  CLICK
  INSTALL
  IN_APP_EVENT
  CONVERSION
  VIDEO_VIEW
  REACH
  LEAD
  PAGE_EVENT
  ENGAGED_VIEW
}

enum Placement {
  PLACEMENT_TIKTOK
  PLACEMENT_PANGLE
  PLACEMENT_GLOBAL_APP_BUNDLE
}

enum Gender {
  GENDER_UNLIMITED
  GENDER_MALE
  GENDER_FEMALE
}

enum AudienceType {
  CUSTOM_AUDIENCE
  LOOKALIKE_AUDIENCE
}

enum AudienceStatus {
  STATUS_ACTIVE
  STATUS_INACTIVE
  STATUS_EXPIRED
  STATUS_PROCESSING
  STATUS_FAILED
}

enum CreativeType {
  SINGLE_IMAGE
  SINGLE_VIDEO
  CAROUSEL
  COLLECTION
  DYNAMIC
}

enum LookalikeTaskStatus {
  STATUS_PROCESSING
  STATUS_SUCCESS
  STATUS_FAILED
  STATUS_CANCELED
}

enum PixelStatus {
  ACTIVE
  INACTIVE
  DELETED
}

enum PixelEventType {
  PAGE_VIEW
  VIEW_CONTENT
  ADD_TO_CART
  INITIATE_CHECKOUT
  PLACE_ORDER
  COMPLETE_PAYMENT
  DOWNLOAD
  FORM
  SEARCH
  SUBSCRIBE
  CONTACT
  REGISTRATION
  CUSTOM
}

enum AttributionWindowType {
  CLICK
  VIEW
  ENGAGED_VIEW
}

enum ReportDataLevel {
  AUCTION_CAMPAIGN
  AUCTION_ADGROUP
  AUCTION_AD
  RESERVATION_CAMPAIGN
  RESERVATION_ADGROUP
  RESERVATION_AD
}

enum ReportType {
  BASIC
  AUDIENCE
  PLAYABLE_MATERIAL
  CATALOG
  DSA
}

enum OrderBy {
  ASC
  DESC
}

enum IdentityType {
  AUTH_CODE
  TT_USER
  BUSINESS_TT_USER
  CUSTOMIZED_USER
}

enum CallToAction {
  LEARN_MORE
  SHOP_NOW
  SIGN_UP
  DOWNLOAD
  BOOK_NOW
  CONTACT_US
  APPLY_NOW
  SUBSCRIBE
  GET_QUOTE
  INSTALL_NOW
  PLAY_GAME
  ORDER_NOW
  OPEN_APP
}

enum CurrencyCode {
  USD
  EUR
  GBP
  JPY
  KRW
  BRL
  MXN
  IDR
  SGD
  AUD
  CAD
  HKD
  TWD
  VND
  THB
  MYR
}

enum AccountStatus {
  ACCOUNT_STATUS_ENABLE
  ACCOUNT_STATUS_DISABLE
  ACCOUNT_STATUS_PUNISHED
  ACCOUNT_STATUS_REVIEW
}

# ─────────────────────────────────────────────
# Core Resource Types
# ─────────────────────────────────────────────

type AdvertiserAccount {
  advertiserId: ID!
  name: String!
  status: AccountStatus!
  currency: CurrencyCode!
  timezone: String!
  balance: Float!
  country: String
  industry: String
  email: String
  company: String
  phoneNumber: String
  address: String
  createTime: DateTime!
  updateTime: DateTime!
  campaigns(page: Int, pageSize: Int, status: CampaignStatus): CampaignConnection!
  pixels: [Pixel!]!
  audiences: [Audience!]!
}

type Campaign {
  campaignId: ID!
  advertiserId: ID!
  campaignName: String!
  objective: CampaignObjective!
  status: CampaignStatus!
  budgetMode: BudgetMode!
  budget: Float
  spendCap: Float
  dailyBudget: Float
  startTime: DateTime
  stopTime: DateTime
  isNewStructure: Boolean
  roas: Float
  splitTest: SplitTest
  createTime: DateTime!
  updateTime: DateTime!
  adGroups(page: Int, pageSize: Int, status: AdGroupStatus): AdGroupConnection!
}

type AdGroup {
  adGroupId: ID!
  campaignId: ID!
  advertiserId: ID!
  adGroupName: String!
  status: AdGroupStatus!
  placements: [Placement!]!
  budgetMode: BudgetMode!
  budget: Float
  scheduleType: String
  scheduleStartTime: DateTime
  scheduleEndTime: DateTime
  optimizationGoal: OptimizationGoal!
  billingEvent: BillingEvent!
  bid: Float
  bidType: String
  targeting: TargetingSpec!
  creativeType: CreativeType
  frequency: Int
  frequencySchedule: Int
  conversionWindow: ConversionWindow
  createTime: DateTime!
  updateTime: DateTime!
  ads(page: Int, pageSize: Int, status: AdStatus): AdConnection!
}

type Ad {
  adId: ID!
  adGroupId: ID!
  campaignId: ID!
  advertiserId: ID!
  adName: String!
  status: AdStatus!
  adText: String
  callToAction: CallToAction
  landingPageUrl: String
  displayName: String
  identity: Identity
  videoId: String
  imageIds: [String!]
  creative: AdCreative
  trackingPixelId: ID
  viewabilityPostSessionType: String
  isAco: Boolean
  createTime: DateTime!
  updateTime: DateTime!
}

type AdCreative {
  creativeId: ID!
  advertiserId: ID!
  creativeName: String!
  creativeType: CreativeType!
  videoInfo: VideoInfo
  imageInfo: ImageInfo
  carouselInfo: CarouselInfo
