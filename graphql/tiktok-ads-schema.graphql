# ─────────────────────────────────────────────
# Query Root
# ─────────────────────────────────────────────

type Query {
  # Advertiser / Account
  advertiserInfo(advertiserId: ID!): AdvertiserAccount
  advertiserList(page: Int, pageSize: Int): [AdvertiserAccount!]!
  bcAccount(bcId: ID!): BcAccount

  # Campaigns
  campaign(advertiserId: ID!, campaignId: ID!): Campaign
  campaigns(advertiserId: ID!, page: Int, pageSize: Int, status: CampaignStatus): CampaignConnection!

  # Ad Groups
  adGroup(advertiserId: ID!, adGroupId: ID!): AdGroup
  adGroups(advertiserId: ID!, campaignId: ID, page: Int, pageSize: Int, status: AdGroupStatus): AdGroupConnection!

  # Ads
  ad(advertiserId: ID!, adId: ID!): Ad
  ads(advertiserId: ID!, adGroupId: ID, campaignId: ID, page: Int, pageSize: Int, status: AdStatus): AdConnection!

  # Creatives
  creative(advertiserId: ID!, creativeId: ID!): AdCreative
  creatives(advertiserId: ID!, page: Int, pageSize: Int): CreativeConnection!

  # Audiences
  audience(advertiserId: ID!, audienceId: ID!): Audience
  audiences(advertiserId: ID!, page: Int, pageSize: Int): AudienceConnection!
  lookalikeAudience(advertiserId: ID!, lookalikeAudienceId: ID!): LookalikeAudience
  lookalikeAudiences(advertiserId: ID!): [LookalikeAudience!]!

  # Pixels & Events
  pixel(advertiserId: ID!, pixelId: ID!): Pixel
  pixels(advertiserId: ID!): [Pixel!]!
  pixelEvents(pixelId: ID!, advertiserId: ID!, page: Int, pageSize: Int): PixelEventConnection!

  # Targeting
  targetingCategories(advertiserId: ID!, type: String): [InterestCategory!]!
  behaviorCategories(advertiserId: ID!): [BehaviorCategory!]!
  geographyList(levelRange: String, countryCodes: [String!]): [JSON!]!
  reachEstimate(input: ReachEstimateInput!): ReachEstimate!
  targetingRecommendation(advertiserId: ID!, objective: CampaignObjective!): TargetingRecommendation

  # Reporting
  report(input: ReportQueryInput!): ReportResponse!
  attributionReport(advertiserId: ID!, campaignId: ID, adGroupId: ID, windowType: AttributionWindowType!, windowDays: Int!, startDate: String!, endDate: String!): AttributionReport!

  # Catalog / Product
  catalog(advertiserId: ID!, catalogId: ID!): Catalog
  catalogs(advertiserId: ID!): [Catalog!]!

  # App / Identity
  appList(advertiserId: ID!): [AppInfo!]!
  identities(advertiserId: ID!): [Identity!]!

  # Creatives / Media
  videoList(advertiserId: ID!, page: Int, pageSize: Int): [VideoInfo!]!
  imageList(advertiserId: ID!, page: Int, pageSize: Int): [ImageInfo!]!
}

# ─────────────────────────────────────────────
# Mutation Root
# ─────────────────────────────────────────────

type Mutation {
  # Campaigns
  createCampaign(input: CampaignCreateInput!): Campaign!
  updateCampaign(input: CampaignUpdateInput!): Campaign!
  deleteCampaign(advertiserId: ID!, campaignId: ID!): Boolean!
  updateCampaignStatus(advertiserId: ID!, campaignIds: [ID!]!, status: CampaignStatus!): Boolean!

  # Ad Groups
  createAdGroup(input: AdGroupCreateInput!): AdGroup!
  updateAdGroup(input: AdGroupUpdateInput!): AdGroup!
  deleteAdGroup(advertiserId: ID!, adGroupId: ID!): Boolean!
  updateAdGroupStatus(advertiserId: ID!, adGroupIds: [ID!]!, status: AdGroupStatus!): Boolean!

  # Ads
  createAd(input: AdCreateInput!): Ad!
  updateAd(input: AdUpdateInput!): Ad!
  deleteAd(advertiserId: ID!, adId: ID!): Boolean!
  updateAdStatus(advertiserId: ID!, adIds: [ID!]!, status: AdStatus!): Boolean!

  # Creatives / Media
  createCreative(input: CreativeCreateInput!): AdCreative!
  uploadVideo(advertiserId: ID!, filename: String!, fileUrl: String): VideoInfo!
  uploadImage(advertiserId: ID!, filename: String!, fileUrl: String): ImageInfo!
  deleteCreative(advertiserId: ID!, creativeId: ID!): Boolean!

  # Audiences
  createCustomAudience(input: CustomAudienceCreateInput!): Audience!
  createLookalikeAudience(input: LookalikeAudienceCreateInput!): LookalikeAudience!
  deleteAudience(advertiserId: ID!, audienceId: ID!): Boolean!
  shareAudience(advertiserId: ID!, audienceId: ID!, targetAdvertiserIds: [ID!]!): Boolean!

  # Pixels & Conversions
  createPixel(input: PixelCreateInput!): Pixel!
  updatePixel(pixelId: ID!, advertiserId: ID!, name: String): Pixel!
  deletePixel(advertiserId: ID!, pixelId: ID!): Boolean!
  sendConversionEvent(input: ConversionsEventInput!): Boolean!
  batchSendConversionEvents(events: [ConversionsEventInput!]!): Int!

  # Budget / Bid adjustments
  updateBudget(advertiserId: ID!, adGroupId: ID!, budget: Float!, budgetMode: BudgetMode!): AdGroup!
  updateBid(advertiserId: ID!, adGroupId: ID!, bid: Float!): AdGroup!
}
