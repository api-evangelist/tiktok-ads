  catalogId: ID!
  title: String!
  description: String
  link: String!
  imageLink: String
  price: Float
  salePrice: Float
  currency: CurrencyCode
  brand: String
  condition: String
  availability: String
  category: String
}

# ─────────────────────────────────────────────
# Connection / Pagination Types
# ─────────────────────────────────────────────

type PageInfo {
  page: Int!
  pageSize: Int!
  totalNumber: Long!
  totalPage: Int!
}

type CampaignConnection {
  pageInfo: PageInfo!
  campaigns: [Campaign!]!
}

type AdGroupConnection {
  pageInfo: PageInfo!
  adGroups: [AdGroup!]!
}

type AdConnection {
  pageInfo: PageInfo!
  ads: [Ad!]!
}

type AudienceConnection {
  pageInfo: PageInfo!
  audiences: [Audience!]!
}

type CreativeConnection {
  pageInfo: PageInfo!
  creatives: [AdCreative!]!
}

type ProductConnection {
  pageInfo: PageInfo!
  products: [Product!]!
}

type PixelEventConnection {
  pageInfo: PageInfo!
  events: [PixelEvent!]!
}

