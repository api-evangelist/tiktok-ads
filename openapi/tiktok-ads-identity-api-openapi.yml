        plugins:
          after_response: []
          before_request: []
        request_query_rule: null
        request_rule:
          advertiser_id: $.http.query.advertiser_id
          context_info: $.http.query.context_info
          store_authorized_bc_id: $.http.query.store_authorized_bc_id
          store_id: $.http.query.store_id
        response_cookie: []
        response_header: []
        response_rule:
          identity_list[][]:
          - display_name: $.rpc.output.identity_list[].name
            identity_authorized_bc_id: $.rpc.output.identity_list[].identity_authorized_bc_id
            identity_authorized_shop_id: $.rpc.output.identity_list[].identity_authorized_shop_id
            identity_id: $.rpc.output.identity_list[].identity_id
            identity_type: $.rpc.output.identity_list[].identity_type
            is_running_custom_shop_ads: $.rpc.output.identity_list[].has_roi1_ads
            live_gmv_max_available: $.rpc.output.identity_list[].available_for_live
            product_gmv_max_available: $.rpc.output.identity_list[].available_for_product
            profile_image: $.rpc.output.identity_list[].avatar_url
            store_id: $.rpc.output.identity_list[].store_id
            unavailable_reason: $.rpc.output.identity_list[].unavailable_reason_for_live
            user_name: $.rpc.output.identity_list[].user_name
      x-open-scene-labels: []
      x-open-settings:
        pop_resp_nullvalue: true
