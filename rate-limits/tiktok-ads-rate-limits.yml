signalling:
  response_headers: []
  headers_note: >-
    TikTok publishes NO rate-limit response headers. There is no X-RateLimit-*, no RateLimit-*, and no
    Retry-After. Throttling is signalled in the JSON body only: the HTTP status stays 200 and the envelope
    carries "code": 40100. An agent therefore cannot read remaining quota from a successful response — it
    can only detect exhaustion after the fact, by parsing the body. A live unauthenticated GET to
    https://business-api.tiktok.com/open_api/v1.3/advertiser/info/ on 2026-08-13 returned HTTP 200 with
    {"code": 40104, ...} and no rate-limit headers of any kind, confirming the docs.
  http_status_on_exhaustion: 200
  error_code_on_exhaustion: 40100
  error_field: code
  retry_after_header: false
  recovery:
    qps: retry after the current second
    qpm: suspend calls for 5 minutes
    qpd: suspend until 00:00:00 UTC+0, when the daily counter resets
scope: per developer application (global limits) and per endpoint (endpoint-specific limits)
