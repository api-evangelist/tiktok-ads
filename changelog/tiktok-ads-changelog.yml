title: What's New
scheme: dated entries grouped by month, each tagged with a change type and a product category
current_version: v1.3
cadence: continuous — changes land within v1.3 rather than in numbered releases
note: 'TikTok runs a dated, categorised changelog for the Marketing API rather than semantic releases. Entries carry
  a change TYPE (product enhancement, new feature, deprecation notice, doc update) and a product CATEGORY, and each
  links to the specific endpoint doc that changed. Captured here is the recent window only — the live page is the
  source of truth and runs back several years. Note the contrast with packages/tiktok-ads-packages.yml: the API
  shipped changes in every month of 2026, while the first-party Python/JavaScript SDKs have not released since 2026-02-27.'
also:
  change_log_api: https://business-api.tiktok.com/portal/docs?id=1738811145996290
  change_log_api_note: Not to be confused with this changelog. TikTok also ships a Change Log API (/changelog/task/create/,
    /check/, /download/) that returns the ADVERTISER's own audit trail of edits to their ad accounts, campaigns,
    ad groups and ads — a different thing entirely.
window:
  from: '2026-03-06'
  to: '2026-08-07'
