model: numeric-scope-ids
note: 'TikTok''s Marketing API does not use string OAuth scopes. Permissions are NUMERIC scope IDs returned in the
  `scope` array of the /oauth2/access_token/ response, organised in a three-level hierarchy: granting a first-level
  ID implies every second- and third-level permission beneath it. The developer selects the permission set when
  creating the developer app; the advertiser approves it at authorization time, and the token carries only what
  the advertiser actually approved — not what the developer requested. This artifact is method: searched because
  derive-oauth-scopes.py found zero oauth2 securitySchemes in the first-party OpenAPI set (the specs declare only
  the Access-Token header), so the scope model exists only in the docs.'
