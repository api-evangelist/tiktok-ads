aid: tiktok-ads
name: TikTok Marketing API
description: TikTok for Business is TikTok's advertising platform, where brands, agencies
  and advertisers create, manage and optimize ad campaigns across TikTok and its family
  of apps. The TikTok API for Business — the Marketing API at
  business-api.tiktok.com/open_api/v1.3 — is the REST interface behind it, covering
  advertiser accounts, campaigns, ad groups, ads, Upgraded Smart+ and GMV Max automation,
  creatives and files, product catalogs, custom and lookalike audiences, Business Center
  asset and member administration, conversion measurement through the Events API, and
  synchronous plus asynchronous reporting. Access is granted by a three-legged advertiser
  authorization that issues a long-lived token presented in an Access-Token header, with
  permissions expressed as a three-level hierarchy of numeric scope IDs. TikTok also
  operates a hosted Model Context Protocol server that packages roughly 400 of these
  endpoints as OAuth-protected MCP tools for AI agents.
