format: proprietary-envelope
note: 'TikTok''s Marketing API does NOT use RFC 9457 problem+json, and does not use HTTP status codes to signal
  application errors. Almost every response is HTTP 200; success or failure is carried by the numeric `code` field
  in the JSON envelope, and TikTok says explicitly that the return code takes precedence over the HTTP status. A
  4xx/5xx HTTP status means the request never reached the API logic (wrong path, wrong method, or a server fault).
  Agents and clients that branch on HTTP status alone will read every TikTok error as a success. There is no `type`
  URI, no `title`/`detail` split, and no machine-readable error taxonomy in the OpenAPI: all 202 first-party operations
  declare only a 200 response whose schema is the generic {code, message, request_id, data} envelope.'
envelope:
  media_type: application/json
  fields:
    code: integer — 0 success, 20001 partial success, 4xxxx client error, 5xxxx service error
    message: human-readable message; the only place field-level detail appears
    request_id: unique request/log id — quote this in support tickets
    data: payload object; {} on error
  example_success: '{"code": 0, "message": "OK", "request_id": "...", "data": {...}}'
  example_error: '{"code": 40002, "message": "Missing required field(s): account_id.", "request_id": "..."}'
  observed: 'A live unauthenticated GET to https://business-api.tiktok.com/open_api/v1.3/advertiser/info/ on 2026-08-13
    returned HTTP 200 with {"code": 40104, "message": "Access token is null, you should set it in http header with
    key Access-Token.", "request_id": "...", "data": {}} — confirming the 200-with-error-code envelope in the wild.'
http_status_handling:
- class: 2xx
  meaning: Request reached the API. Check `code`; only 0 (or 20001) is success.
- class: 4xx
  meaning: Request is invalid at the HTTP layer — usually a wrong API path or wrong method (a missing trailing slash
    is the classic cause of 404 page not found).
- class: 5xx
  meaning: Server failed to process the request. Wait ~5 minutes and retry; if it repeats, raise a ticket.
code_ranges:
  '0': successful
  '20001': partially successful
  4xxxx: client-side error — parameters, permissions, auth, quota
  5xxxx: service error; refer to the response message
categories:
- Advertisers
- Advertising policy related
- Async task error
- Authentication related
- Blocked access
- File management related
- General
- Internal service error
- Maintenance
- Rate limit or quota related
- Return codes for successful calls
- Runtime error
- System related
